<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EuroScout AI — Interactive Football Player Analytics Dashboard. Find similar players, compare stats, and explore Big 5 European league data." />
  <meta name="keywords" content="football, soccer, analytics, player comparison, scouting, Premier League, La Liga, Bundesliga, Serie A, Ligue 1" />
  <title>EuroScout AI — Player Analytics Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 32 32" fill="none">
              <circle cx="16" cy="16" r="14" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
              <path d="M16 6 L19 12 L25 13 L21 17 L22 23 L16 20 L10 23 L11 17 L7 13 L13 12 Z" fill="url(#logoGrad)" opacity="0.9"/>
              <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#00f5a0"/><stop offset="100%" stop-color="#00d9f5"/></linearGradient></defs>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-title">EuroScout</span>
            <span class="logo-subtitle">AI</span>
          </div>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-stats"><span class="stat-label">Players</span><span class="stat-value" id="total-players">—</span></div>
        <div class="sidebar-stats"><span class="stat-label">Leagues</span><span class="stat-value">5</span></div>
      </div>
    </aside>
    <main id="main-content" class="main-content">
      <header class="main-header" id="main-header">
        <div class="header-left">
          <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Open menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 id="page-title" class="page-title">Dashboard</h1>
        </div>
        <div class="header-right">
          <div class="global-search" id="global-search">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="global-search-input" class="search-input" placeholder="Search players..." autocomplete="off" />
            <div id="global-search-results" class="search-results"></div>
          </div>
        </div>
      </header>
      <div id="view-container" class="view-container">
        <div class="loading-screen" id="loading-screen">
          <div class="loader"><div class="loader-ring"></div><div class="loader-text">Loading EuroScout AI...</div></div>
        </div>
      </div>
    </main>
  </div>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
